<meta charset="utf-8">
<title>Fuel Up Mission</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Orbitron:wght@700;900&display=swap">
<style>
/* Layout: one full-screen launch-pad scene (SVG): co-pilot Bolt left, fuel tray centre, rocket right, number pad bottom.
   Deliberately a single night-sky look, so colours are explicit rather than themed. */
:root{color-scheme:dark;--space:#070b1f;--ink:#e8f1ff;--cyan:#38e1ff;--green:#5dff8a;--orange:#ff8a1f;
  --round:"Baloo 2","Trebuchet MS",system-ui,sans-serif;--title:"Orbitron","Baloo 2",system-ui,sans-serif}
html,body{height:100%;margin:0}
body{background:#070b1f;overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:var(--round)}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ui{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:8px;z-index:5}
.ui button{font-family:var(--round);font-weight:600;font-size:14px;border:1px solid rgba(56,225,255,.4);border-radius:999px;padding:6px 12px;background:rgba(7,11,31,.7);color:#bfefff;cursor:pointer}
.ui button:focus-visible{outline:3px solid var(--cyan)}
.rotate{display:none}
@media (orientation:portrait) and (max-width:700px){.rotate{display:flex;position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;text-align:center;padding:24px;background:#070b1f;color:#38e1ff;font:800 30px var(--round)}}
#bolt-fx,#fx,#scan,#overlayText{pointer-events:none}
.t-title{font-family:var(--title);font-weight:900;fill:#e8f1ff;letter-spacing:2px}
.t-label{font-family:var(--title);font-weight:700;fill:#7fdcff;letter-spacing:3px}
.t-num{font-family:var(--round);font-weight:800;text-anchor:middle;dominant-baseline:central}
.mv{transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.mv.slow{transition-duration:1s}
.twinkle{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.bob{animation:bob 2.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.1)}}
.pulse{animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.flash{animation:flash .6s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.shake{animation:shake .5s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,3px)}}
.flame{animation:flame .12s linear infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes flame{from{transform:scaleY(.85) scaleX(.95)}to{transform:scaleY(1.15) scaleX(1.05)}}
.padbtn{cursor:pointer}
.padbtn rect{transition:fill .15s}
.padbtn.off{opacity:.35;pointer-events:none}
.padbtn:hover rect.face{fill:#1d3b78}
@media (prefers-reduced-motion:reduce){.twinkle,.bob,.blink,.pulse,.shake,.flame{animation:none!important}.mv{transition-duration:.15s!important}}
</style>

<div class="rotate">Turn your device sideways to fly</div>

<svg id="game" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid meet" aria-label="Fuel Up mission">
<defs>
  <radialGradient id="bg" cx=".7" cy=".2" r="1"><stop offset="0" stop-color="#1b2a6b"/><stop offset=".55" stop-color="#0b1236"/><stop offset="1" stop-color="#05081a"/></radialGradient>
  <radialGradient id="planet" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffb36b"/><stop offset=".6" stop-color="#e2553c"/><stop offset="1" stop-color="#6b1f3a"/></radialGradient>
  <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9ffcf"/><stop offset=".45" stop-color="#4dff86"/><stop offset="1" stop-color="#11b35a"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f0f7"/><stop offset="1" stop-color="#9aaabd"/></linearGradient>

  <linearGradient id="flameG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b0"/><stop offset=".4" stop-color="#ffb21f"/><stop offset="1" stop-color="#ff4b1f" stop-opacity="0"/></linearGradient>

  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".45"/></filter>
  <g id="cellShape"><rect x="-30" y="-30" width="60" height="60" rx="12" fill="url(#cell)" stroke="#0b7a3c" stroke-width="3"/><path d="M4 -20 L-10 4 H1 L-4 20 L12 -6 H1Z" fill="#0b6b34" opacity=".75"/><rect x="-22" y="-24" width="20" height="8" rx="4" fill="#fff" opacity=".55"/></g>
</defs>

<!-- launch pad + rocket -->
<g id="stage">
<rect x="880" y="600" width="250" height="26" rx="6" fill="#2f3b66"/><rect x="900" y="626" width="20" height="124" fill="#2f3b66"/><rect x="1090" y="626" width="20" height="124" fill="#2f3b66"/>
<g id="rocket" class="mv" style="transform:translate(0px,0px)">
  <g id="rocketInner">
    <g id="flames" opacity="0"><path class="flame" d="M975 590 Q1005 720 1035 590Z" fill="url(#flameG)"/><path class="flame" d="M988 590 Q1005 670 1022 590Z" fill="#fffbe0" opacity=".85"/></g>
    <path d="M960 470 L920 560 L920 600 L965 575Z" fill="#e2553c"/><path d="M1050 470 L1090 560 L1090 600 L1045 575Z" fill="#e2553c"/>
    <path d="M1005 170 C 1060 230 1062 330 1055 590 H955 C 948 330 950 230 1005 170Z" fill="url(#rocketBody)" stroke="#7c8aa3" stroke-width="3"/>
    <path d="M1005 170 C 1030 195 1045 220 1052 250 H958 C 965 220 980 195 1005 170Z" fill="#e2553c"/>
    <circle cx="1005" cy="330" r="34" fill="#163a7a" stroke="#7c8aa3" stroke-width="6"/><circle cx="995" cy="320" r="10" fill="#9fd8ff" opacity=".7"/>
    <rect x="985" y="575" width="40" height="20" rx="4" fill="#4b587a"/>
    <text x="1005" y="450" class="t-title" text-anchor="middle" style="font-size:22px;fill:#163a7a">CAPT</text>
  </g>
</g>

<g transform="translate(850 210)">

  <g id="gauge"></g>
  <text x="0" y="400" class="t-label" text-anchor="middle" style="font-size:13px">FUEL</text>
</g>

<!-- tray -->

</g>

<!-- supply crate -->
<g id="crate" opacity="0">

<!-- Bolt -->
<g id="bolt" transform="translate(170 330)"><g class="bob">
  <line x1="0" y1="-118" x2="0" y2="-88" stroke="#9aaabd" stroke-width="6"/><circle id="antenna" cx="0" cy="-124" r="10" fill="#ff4b4b" filter="url(#glow)"/>
  <rect x="-80" y="-90" width="160" height="128" rx="30" fill="url(#metal)" stroke="#6d7d94" stroke-width="4"/>
  <rect x="-62" y="-72" width="124" height="88" rx="18" fill="#0b1236"/>
  <g class="blink"><rect x="-42" y="-56" width="24" height="34" rx="10" fill="#38e1ff" filter="url(#glow)"/><rect x="18" y="-56" width="24" height="34" rx="10" fill="#38e1ff" filter="url(#glow)"/></g>
  <g id="mouth"></g>
  <rect x="-90" y="-40" width="14" height="40" rx="6" fill="#9aaabd"/><rect x="76" y="-40" width="14" height="40" rx="6" fill="#9aaabd"/>
  <rect x="-56" y="44" width="112" height="86" rx="20" fill="url(#metal)" stroke="#6d7d94" stroke-width="4"/>
  <circle cx="0" cy="86" r="16" fill="#ff8a1f" filter="url(#glow)"/>
  <path d="M-56 66 Q-96 80 -92 120" stroke="#9aaabd" stroke-width="12" fill="none" stroke-linecap="round"/>

</g></g>

<!-- top bar -->

  <circle r="26" fill="#1a2550" stroke="#ffd84d" stroke-width="3"/>
  <path d="M0 -14 a10 10 0 0 1 7 17 v5 h-14 v-5 a10 10 0 0 1 7 -17z" fill="#ffd84d"/><rect x="-6" y="10" width="12" height="4" rx="2" fill="#ffd84d"/>
</g>

<g id="fx"></g>

<g id="screens"></g>
</svg>

<script>
(()=>{
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id),svg=$("game");
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function pos(g,x,y,s=1){g._x=x;g._y=y;g.style.transform=`translate(${x}px,${y}px) scale(${s})`;}

/* stars */
for(let i=0;i<110;i++){const c=el("circle",{cx:Math.random()*1200,cy:Math.random()*560,r:Math.random()*1.8+.4,fill:"#fff",class:"twinkle"},$("stars"));c.style.animationDelay=(-Math.random()*3)+"s";c.style.animationDuration=(2+Math.random()*3)+"s";}

/* ---------------- audio ---------------- */
const LINES=["intro1","intro2","demo1","demo2","l1_go","l1_predict","full1","full2","full3","over","under","hint","l2_intro","l2_tip","sharp1","sharp2","l3_intro","ready","complete","best","next","welcome_back","countdown","mc_go"];
for(let i=1;i<=9;i++)LINES.push("bond_"+i);for(let i=1;i<=10;i++)LINES.push("seen_"+i);
let ac=null,master=null,musicGain=null,musicOn=true,cur=null;const buf={};
function initAudio(){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);
  musicGain=ac.createGain();musicGain.gain.value=.06;const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;musicGain.connect(lp);lp.connect(master);}catch(e){}}
async function loadVoices(){await Promise.all(LINES.map(async k=>{try{const r=await fetch("audio/"+k+".mp3");buf[k]=await ac.decodeAudioData(await r.arrayBuffer());}catch(e){}}));}
let mouthT=null;const mouth=$("mouth");
for(let i=0;i<7;i++)el("rect",{x:-35+i*10,y:2,width:7,height:8,rx:2,fill:"#38e1ff",opacity:.25},mouth);
function talking(on){clearInterval(mouthT);const bars=[...mouth.children];if(!on){bars.forEach(b=>{b.setAttribute("opacity",.25);b.setAttribute("height",8);b.setAttribute("y",2)});return;}
  mouthT=setInterval(()=>bars.forEach(b=>{const h=4+Math.random()*12;b.setAttribute("height",h);b.setAttribute("y",6-h/2);b.setAttribute("opacity",.9)}),90);}
function say(k){return new Promise(res=>{
  if(cur){try{cur.onended=null;cur.stop()}catch(e){}}
  let done=false;const fin=()=>{if(done)return;done=true;talking(false);duck(false);res();};
  const b=buf[k];if(!ac||!b){setTimeout(fin,900);return;}
  const s=ac.createBufferSource();s.buffer=b;s.connect(master);s.onended=fin;cur=s;
  if(k!=="countdown"&&k!=="mc_go")talking(true);duck(true);s.start();setTimeout(fin,b.duration*1000+500);});}
function duck(on){if(musicGain)musicGain.gain.setTargetAtTime(musicOn?(on?.025:.06):0,ac.currentTime,.25);}
function tone(f,t,d,type="sine",v=.2,dest){if(!ac)return null;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+d+.05);return o;}
function noise(d,v,freq){if(!ac)return;const n=ac.createBufferSource(),b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;n.buffer=b;const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=freq;const g=ac.createGain();const t=ac.currentTime;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);n.connect(f);f.connect(g);g.connect(master);n.start();}
const sfx={
  zap(){if(!ac)return;const t=ac.currentTime;const o=tone(300,t,.18,"sawtooth",.08);o&&o.frequency.exponentialRampToValueAtTime(1200,t+.15);tone(1600,t+.05,.12,"sine",.08);},
  full(){if(!ac)return;const t=ac.currentTime;[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.07,.5,"triangle",.14));},
  bonk(){if(!ac)return;const t=ac.currentTime;const o=tone(220,t,.3,"sine",.25);o&&o.frequency.exponentialRampToValueAtTime(110,t+.25);},
  spill(){noise(.5,.25,2500);},
  beep(){if(!ac)return;tone(1200,ac.currentTime,.08,"square",.05);},
  tap(){if(!ac)return;tone(880,ac.currentTime,.06,"triangle",.1);},
  rumble(){noise(3.5,.5,400);},
  star(i){if(!ac)return;const t=ac.currentTime;tone(784*Math.pow(1.26,i),t,.6,"triangle",.16);tone(1568*Math.pow(1.26,i),t+.05,.5,"sine",.06);}
};
let musicT=null;function startMusic(){if(!ac||musicT)return;const chords=[[220,277,330],[196,247,294],[175,220,262],[196,247,330]];let i=0;
  const play=()=>{const t=ac.currentTime;chords[i%4].forEach(f=>{tone(f,t,4.2,"sine",.5,musicGain);tone(f*2,t+.4,3,"triangle",.12,musicGain);});i++;};play();musicT=setInterval(play,4000);}

/* ---------------- tray ---------------- */
const SLOT=i=>[406+(i%5)*80,274+Math.floor(i/5)*80];
for(let i=0;i<10;i++){const [x,y]=SLOT(i);el("rect",{x:x-33,y:y-33,width:66,height:66,rx:14,fill:"#0b1236",stroke:"#2d4b8f","stroke-width":2,class:"slot"},$("slots"));}
let tray=[];
function makeCell(x,y,parent){const g=el("g",{class:"mv",style:"transition:none"},parent||$("cells"));el("use",{href:"#cellShape"},g);pos(g,x,y);void g.getBoundingClientRect();g.style.transition="";return g;}
function setTray(n){$("cells").innerHTML="";tray=[];for(let i=0;i<n;i++){const [x,y]=SLOT(i);const c=makeCell(x,y);c.firstChild.classList.add("pop");tray.push(c);}}
async function flyIn(k,from=[566,700],gap=180){
  for(let j=0;j<k;j++){const i=tray.length;if(i>=10)break;const c=makeCell(from[0],from[1]);c.style.transition="none";void c.getBoundingClientRect();c.style.transition="";
    tray.push(c);const [x,y]=SLOT(i);requestAnimationFrame(()=>pos(c,x,y));sfx.zap();await sleep(gap);}
  await sleep(300);
}
async function spill(k){for(let j=0;j<k;j++){const c=makeCell(566,700);c.style.transition="none";void c.getBoundingClientRect();c.style.transition="transform .5s ease-out";
  requestAnimationFrame(()=>pos(c,566+(j-k/2)*40,250));sfx.spill();await sleep(260);c.style.transition="transform .8s ease-in";pos(c,500+Math.random()*200,900,.6);setTimeout(()=>c.remove(),900);}
  sparks(566,240);}
function glowEmpty(on){[...$("slots").children].forEach((s,i)=>{s.classList.toggle("pulse",on&&i>=tray.length);s.setAttribute("stroke",on&&i>=tray.length?"#38e1ff":"#2d4b8f");s.setAttribute("stroke-width",on&&i>=tray.length?4:2);});}
async function fullFlash(){const r=el("rect",{x:358,y:224,width:416,height:180,rx:22,fill:"#5dff8a",class:"flash"},$("fx"));sfx.full();tray.forEach(c=>c.querySelector("use").setAttribute("filter","url(#glow)"));setTimeout(()=>r.remove(),700);await sleep(500);}
function rowHighlight(on){$("fx").querySelectorAll(".rowhl").forEach(e=>e.remove());if(on)el("rect",{x:368,y:236,width:396,height:78,rx:16,fill:"none",stroke:"#ffd84d","stroke-width":5,class:"rowhl pulse"},$("fx"));}
function sparks(x,y){for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,d=40+Math.random()*60;const s=el("circle",{cx:x,cy:y,r:4,fill:i%2?"#ffd84d":"#5dff8a",class:"mv slow"},$("fx"));requestAnimationFrame(()=>{s.style.transform=`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`;s.style.opacity=0;s.style.transition="transform .8s ease-out, opacity .8s";});setTimeout(()=>s.remove(),900);}}

/* ---------------- gauge + pips ---------------- */
function drawGauge(n,total){const g=$("gauge");g.innerHTML="";const h=360/total;for(let i=0;i<total;i++){el("rect",{x:-14,y:360-(i+1)*h+4,width:28,height:h-6,rx:5,fill:i<n?"#5dff8a":"#1d2a55",filter:i<n?"url(#glow)":""},g);}}
function drawPips(p){const g=$("pips");g.innerHTML="";["FILL","SCAN","LAUNCH"].forEach((t,i)=>{const x=i*120;el("rect",{x,y:0,width:110,height:26,rx:13,fill:i<p?"#1f6b45":i===p?"#38e1ff":"#1a2550",stroke:"#38e1ff","stroke-width":1.5},g);const tx=el("text",{x:x+55,y:18,"text-anchor":"middle",class:"t-label",style:`font-size:12px;fill:${i===p?"#07102e":"#bfefff"}`},g);tx.textContent=(i<p?"✓ ":"")+t;});}

/* ---------------- number pad (laid out like a tray of ten) ---------------- */
let padResolve=null,padT0=0;
const padG=$("pad");
for(let n=1;n<=10;n++){const c=(n-1)%5,r=Math.floor((n-1)/5);const x=376+c*96,y=586+r*80;
  const b=el("g",{class:"padbtn off",transform:`translate(${x} ${y})`},padG);
  el("rect",{x:0,y:0,width:84,height:68,rx:16,fill:"#14244f",stroke:"#38e1ff","stroke-width":2.5,class:"face"},b);
  const t=el("text",{x:42,y:36,class:"t-num",style:"font-size:40px;fill:#e8f1ff"},b);t.textContent=n;
  b.addEventListener("pointerdown",e=>{e.preventDefault();if(!padResolve)return;sfx.tap();const r=padResolve;padResolve=null;padOn(false);r({n,ms:performance.now()-padT0});});
}
function padOn(on){[...padG.children].forEach(b=>b.classList.toggle("off",!on));}
function askPad(){padOn(true);padT0=performance.now();return new Promise(r=>padResolve=r);}

/* ---------------- hint ---------------- */
let hintOn=false,hintsUsed=0;
function hintAvailable(on){hintOn=on;$("hintBtn").setAttribute("opacity",on?1:0);}
$("hintBtn").addEventListener("pointerdown",async e=>{e.preventDefault();if(!hintOn)return;hintsUsed++;glowEmpty(true);await say("hint");setTimeout(()=>glowEmpty(false),2500);});

/* ---------------- drag rounds ---------------- */
function dragRound(n){
  return new Promise(res=>{
    $("crate").setAttribute("opacity",1);const cg=$("crateCells");cg.innerHTML="";
    const spares=[];for(let i=0;i<10-n+2;i++){const c=makeCell(420+i*(300/(10-n+1)),488,cg);c.style.cursor="grab";spares.push(c);}
    let drag=null;
    const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
    const down=(c,e)=>{if(tray.includes(c))return;e.preventDefault();drag=c;c._home=[c._x,c._y];c.style.transition="none";svg.setPointerCapture(e.pointerId);sfx.tap();};
    spares.forEach(c=>c.addEventListener("pointerdown",e=>down(c,e)));
    const move=e=>{if(!drag)return;const p=pt(e);pos(drag,p.x,p.y,1.1);};
    const up=async e=>{if(!drag)return;const c=drag;drag=null;c.style.transition="";const p=pt(e);
      const overTray=p.x>340&&p.x<790&&p.y>200&&p.y<430;
      if(overTray&&tray.length<10){$("cells").appendChild(c);const [x,y]=SLOT(tray.length);tray.push(c);pos(c,x,y);sfx.zap();c.style.cursor="";
        if(tray.length===10){cleanup();$("crate").setAttribute("opacity",0);cg.innerHTML="";res();}}
      else{if(overTray){sfx.bonk();}pos(c,...c._home);}};
    const cleanup=()=>{svg.removeEventListener("pointermove",move);svg.removeEventListener("pointerup",up);svg.removeEventListener("pointercancel",up);};
    svg.addEventListener("pointermove",move);svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
  });
}

/* ---------------- predict round (shared by Fill and Launch parts) ---------------- */
const fullLines=["full1","full2","full3"];
async function predictRound(n,fast){
  setTray(n);await sleep(fast?250:600);
  hintAvailable(true);const r=await askPad();hintAvailable(false);
  const need=10-n,k=r.n;let ok=k===need;
  if(ok){await flyIn(k,[566,700],fast?90:160);await fullFlash();if(!fast)await say(fullLines[rnd(0,2)]);}
  else if(k>need){await flyIn(need,[566,700],120);await spill(k-need);sfx.bonk();await say("over");await say("bond_"+n);await fullFlash();}
  else{await flyIn(k,[566,700],150);glowEmpty(true);sfx.bonk();await say("under");await flyIn(need-k,[566,700],220);glowEmpty(false);await say("bond_"+n);await fullFlash();}
  return {n,answer:k,ok,ms:r.ms};
}

/* ---------------- scanner round ---------------- */
async function scanRound(n){
  const scan=$("scan");scan.setAttribute("opacity",1);$("scanLines").innerHTML="";
  for(let i=0;i<9;i++)el("rect",{x:370,y:236+i*18,width:392,height:3,fill:"#38e1ff",opacity:.15},$("scanLines"));
  setTray(n);await sleep(700);sfx.beep();scan.setAttribute("opacity",0);
  await sleep(1200);scan.setAttribute("opacity",1);sfx.beep();
  const r=await askPad();scan.setAttribute("opacity",0);
  const ok=r.n===n;
  if(ok){sparks(566,314);sfx.full();await say(Math.random()<.5?"sharp1":"sharp2");}else sfx.bonk();
  rowHighlight(n>=5);await say("seen_"+n);rowHighlight(false);
  return {n,answer:r.n,ok,ms:r.ms};
}

/* ---------------- screens ---------------- */
const KEY="space-fuel-up";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function store(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function button(parent,x,y,label,w=260){const g=el("g",{style:"cursor:pointer",transform:`translate(${x} ${y})`},parent);
  el("rect",{x:-w/2,y:-38,width:w,height:76,rx:38,fill:"#ff8a1f",stroke:"#ffd2a3","stroke-width":4,filter:"url(#shadow)"},g);
  const t=el("text",{x:0,y:2,class:"t-title","text-anchor":"middle","dominant-baseline":"central",style:"font-size:28px;fill:#fff"},g);t.textContent=label;return g;}
function starShape(parent,x,y,s,filled,cls){const g=el("g",{transform:`translate(${x} ${y}) scale(${s})`},parent);const p=el("path",{d:"M0 -40 L11 -13 L40 -12 L17 6 L25 36 L0 19 L-25 36 L-17 6 L-40 -12 L-11 -13Z",fill:filled?"#ffd84d":"#26335f",stroke:filled?"#fff3b0":"#3a4a80","stroke-width":3,class:cls||""},g);return g;}
function titleScreen(){
  return new Promise(res=>{
    const s=$("screens");s.innerHTML="";const g=el("g",{},s);
    el("rect",{width:1200,height:750,fill:"#05081a",opacity:.72},g);
    const t=el("text",{x:600,y:250,class:"t-title","text-anchor":"middle",style:"font-size:72px"},g);t.textContent="FUEL UP";
    const st=el("text",{x:600,y:300,class:"t-label","text-anchor":"middle",style:"font-size:20px"},g);st.textContent="MISSION 1 · PLANET TEN";
    const d=load();if(d.stars){for(let i=0;i<3;i++)starShape(g,540+i*60,370,.7,i<d.stars);}
    const b=button(g,600,480,d.stars?"FLY AGAIN":"START MISSION",320);
    b.addEventListener("pointerdown",e=>{e.preventDefault();if(!ac){initAudio();try{ac.resume()}catch(_){}}s.innerHTML="";res(!!d.stars);});
  });
}
async function bigText(t,ms=700){const o=$("overlayText");o.textContent=t;o.setAttribute("opacity",1);o.classList.remove("pop");void o.getBoundingClientRect();o.classList.add("pop");await sleep(ms);o.setAttribute("opacity",0);}

/* ---------------- mission ---------------- */
async function mission(returning){
  const results={fill:[],scan:[],launch:[]};hintsUsed=0;
  drawGauge(0,8);drawPips(0);
  if(returning){await say("welcome_back");}
  else{await say("mc_go");await say("intro1");await say("intro2");
    // demo once
    setTray(7);await sleep(500);glowEmpty(true);await say("demo1");await flyIn(3,[200,420],350);glowEmpty(false);await fullFlash();await say("demo2");}

  // PART 1: FILL
  drawPips(0);
  for(let i=0;i<2;i++){setTray(rnd(4,8));if(i===0&&!returning)await say("l1_go");await dragRound(tray.length);await fullFlash();await say(fullLines[i]);}
  await say("l1_predict");
  const p1=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,4);
  for(const n of p1)results.fill.push(await predictRound(n,false));

  // PART 2: SCAN
  drawPips(1);$("cells").innerHTML="";tray=[];
  await say("l2_intro");
  const seq=shuffle([5,6,7,8,9,10,4,3]).slice(0,5);
  let tipped=false;
  for(const [i,n] of seq.entries()){const r=await scanRound(n);results.scan.push(r);if(!r.ok&&!tipped){tipped=true;await say("l2_tip");}if(i===0&&r.ok&&!tipped&&n!==5&&n<10){tipped=true;await say("l2_tip");}}

  // PART 3: LAUNCH COUNTDOWN
  drawPips(2);await say("l3_intro");
  const p3=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,8);
  for(const [i,n] of p3.entries()){const r=await predictRound(n,true);results.launch.push(r);drawGauge(i+1,8);sfx.zap();}
  $("cells").innerHTML="";tray=[];
  drawPips(3);await say("ready");
  // countdown + lift off
  const cd=say("countdown");await bigText("3",650);await bigText("2",650);await bigText("1",650);
  $("flames").setAttribute("opacity",1);sfx.rumble();$("stage").classList.add("shake");
  const rk=$("rocket");rk.style.transition="transform 3s cubic-bezier(.5,0,.8,.4)";rk.style.transform="translate(0px,-900px)";
  await cd;await sleep(2600);$("stage").classList.remove("shake");
  return results;
}

async function resultsScreen(res){
  const L=res.launch,okL=L.filter(r=>r.ok).length,times=L.map(r=>r.ms).sort((a,b)=>a-b),med=times[Math.floor(times.length/2)]||0;
  const stars=okL>=7&&med<3500?3:okL>=6?2:1;
  const d=load();const newBest=!d.bestMs||(okL>=6&&med<d.bestMs);
  d.stars=Math.max(d.stars||0,stars);if(okL>=6&&newBest)d.bestMs=Math.round(med);d.plays=(d.plays||0)+1;
  d.history=(d.history||[]).concat([{date:new Date().toISOString().slice(0,10),fill:res.fill.filter(r=>r.ok).length+"/"+res.fill.length,scan:res.scan.filter(r=>r.ok).length+"/"+res.scan.length,launch:okL+"/"+L.length,medianMs:Math.round(med),hints:hintsUsed}]).slice(-20);
  store(d);
  const s=$("screens");s.innerHTML="";const g=el("g",{},s);
  el("rect",{width:1200,height:750,fill:"#05081a",opacity:.8},g);
  const t=el("text",{x:600,y:170,class:"t-title","text-anchor":"middle",style:"font-size:56px"},g);t.textContent="MISSION COMPLETE";
  const sg=el("g",{},g);
  for(let i=0;i<3;i++){starShape(sg,480+i*120,300,1.4,false);}
  await say("complete");
  for(let i=0;i<stars;i++){starShape(sg,480+i*120,300,1.4,true,"pop");sfx.star(i);await sleep(450);}
  const tm=el("text",{x:600,y:410,class:"t-label","text-anchor":"middle",style:"font-size:20px"},g);
  tm.textContent=`COUNTDOWN: ${okL}/${L.length} · ${(med/1000).toFixed(1)} s PER TRAY`;
  if(okL>=6&&newBest&&d.plays>1)await say("best");
  // planet map
  const m=el("g",{transform:"translate(0 0)"},g);
  el("path",{d:"M380 520 Q600 470 820 520",stroke:"#38e1ff","stroke-width":3,"stroke-dasharray":"8 8",fill:"none"},m);
  el("circle",{cx:380,cy:520,r:34,fill:"#5dff8a",filter:"url(#glow)"},m);const a=el("text",{x:380,y:522,class:"t-num",style:"font-size:28px;fill:#07102e"},m);a.textContent="10";
  el("circle",{cx:820,cy:520,r:34,fill:"#26335f",stroke:"#7fdcff","stroke-width":2},m);const b2=el("text",{x:820,y:522,class:"t-num",style:"font-size:24px;fill:#7fdcff"},m);b2.textContent="13";
  const l1=el("text",{x:380,y:575,class:"t-label","text-anchor":"middle",style:"font-size:13px"},m);l1.textContent="PLANET TEN ✓";
  const l2=el("text",{x:820,y:575,class:"t-label","text-anchor":"middle",style:"font-size:13px"},m);l2.textContent="PLANET TEEN · NEXT";
  await say("next");
  const btn=button(g,600,665,"FLY AGAIN",280);btn.addEventListener("pointerdown",()=>location.reload());
  const pnote=el("text",{x:1180,y:735,"text-anchor":"end",style:"font:600 13px var(--round);fill:#7f8fb8"},g);
  const last=d.history[d.history.length-1];pnote.textContent=`For parents · fill ${last.fill} · scan ${last.scan} · countdown ${last.launch} · hints ${last.hints}`;
}

/* ---------------- start ---------------- */
async function boot(){
  const returning=await titleScreen();
  if(!ac)initAudio();try{await ac.resume()}catch(e){}
  await loadVoices();startMusic();
  const res=await mission(returning);
  await resultsScreen(res);
}
$("musicBtn").addEventListener("click",e=>{musicOn=!musicOn;e.target.textContent=musicOn?"Music on":"Music off";if(ac)duck(false);});
$("restartBtn").addEventListener("click",()=>location.reload());
drawGauge(0,8);drawPips(0);boot();
})();
